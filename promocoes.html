<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promoções – Nexora Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <aside class="admin-sidebar" style="width:240px;flex-shrink:0">
    <div class="px-3 mb-4">
      <a href="../index.html" class="text-white fw-bold text-decoration-none"><i class="bi bi-hexagon-fill me-2" style="color:var(--primary)"></i>Nexora</a>
      <div class="small text-muted mt-1">Painel Admin</div>
    </div>
    <nav class="nav flex-column">
      <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
      <a class="nav-link" href="produtos.html"><i class="bi bi-box-seam me-2"></i> Produtos</a>
      <a class="nav-link active" href="promocoes.html"><i class="bi bi-tag me-2"></i> Promoções</a>
      <a class="nav-link" href="pedidos.html"><i class="bi bi-receipt me-2"></i> Pedidos</a>
      <a class="nav-link" href="usuarios.html"><i class="bi bi-people me-2"></i> Usuários</a>
      <a class="nav-link" href="visibilidade.html"><i class="bi bi-eye me-2"></i> Visibilidade</a>
      <a class="nav-link" href="anuncios.html"><i class="bi bi-megaphone me-2"></i> Anúncios</a>
      <hr style="border-color:var(--dark-4);margin:1rem 1rem">
      <a class="nav-link" href="../index.html"><i class="bi bi-shop me-2"></i> Ver Loja</a>
      <a class="nav-link text-danger" href="#" onclick="sessionStorage.clear();location.href='login.html'"><i class="bi bi-box-arrow-left me-2"></i> Sair</a>
    </nav>
  </aside>

  <main class="flex-grow-1 p-4" style="background:var(--black);min-height:100vh">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="h3 fw-bold text-white mb-0">Promoções</h1>
        <p class="text-muted small mb-0">Promoções ativas aplicam desconto em toda a loja automaticamente</p>
      </div>
      <button class="btn btn-primary rounded-pill" onclick="openPromoModal()"><i class="bi bi-plus-lg me-1"></i> Nova Promoção</button>
    </div>

    <div class="row g-3" id="promoGrid"></div>
    <div id="emptyPromos" class="text-center py-5 text-muted" style="display:none">
      <i class="bi bi-tag display-5 d-block mb-2"></i>
      <p>Nenhuma promoção. Crie uma com nome e porcentagem.</p>
    </div>
  </main>
</div>

<div class="modal fade" id="promoModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content border-0" style="border-radius:16px">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="promoModalTitle">Nova Promoção</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="promoId">
        <div class="mb-3"><label class="form-label small fw-semibold">Nome da promoção</label><input type="text" class="form-control" id="promoName" placeholder="Ex: Black Friday, Desconto de Inverno"></div>
        <div class="mb-3"><label class="form-label small fw-semibold">Código do cupom (opcional)</label><input type="text" class="form-control" id="promoCode" placeholder="Ex: NEXORA10"></div>
        <div class="mb-3"><label class="form-label small fw-semibold">Desconto (%)</label><input type="number" class="form-control" id="promoPercent" min="1" max="90" value="10"></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" id="promoActive" checked><label class="form-check-label" for="promoActive">Ativar agora</label></div>
      </div>
      <div class="modal-footer border-0">
        <button class="btn btn-outline-secondary rounded-pill" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary rounded-pill" onclick="savePromoForm()">Salvar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script>
if(!sessionStorage.getItem('nx_admin')) location.href='login.html';

function renderPromos() {
  const list = getPromos();
  const grid = document.getElementById('promoGrid');
  const empty = document.getElementById('emptyPromos');
  if (!list.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = list.map(p => `
    <div class="col-md-4">
      <div class="card border-0 rounded-4 h-100 ${p.active ? '' : 'opacity-75'}">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between mb-2">
            <span class="badge ${p.active ? 'bg-success' : 'bg-secondary'}">${p.active ? 'Ativa' : 'Pausada'}</span>
            <span class="fw-bold text-primary">${p.percent}%</span>
          </div>
          <h5 class="fw-bold text-white mt-1">${p.name}</h5>
          <p class="small text-muted mb-3">Cupom: <code>${p.code}</code></p>
          <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-sm btn-outline-secondary rounded-pill" onclick="openPromoModal(${p.id})"><i class="bi bi-pencil"></i> Editar</button>
            <button class="btn btn-sm btn-outline-${p.active ? 'warning' : 'success'} rounded-pill" onclick="togglePromo(${p.id});renderPromos();showToast('Status da promoção alterado')">
              ${p.active ? 'Pausar' : 'Ativar'}
            </button>
            <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="if(confirm('Excluir esta promoção?')){deletePromo(${p.id});renderPromos();showToast('Promoção removida')}">Excluir</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

function openPromoModal(id) {
  document.getElementById('promoId').value = id || '';
  document.getElementById('promoModalTitle').textContent = id ? 'Editar Promoção' : 'Nova Promoção';
  if (id) {
    const p = getPromos().find(x => x.id === Number(id));
    if (!p) return;
    document.getElementById('promoName').value = p.name;
    document.getElementById('promoCode').value = p.code;
    document.getElementById('promoPercent').value = p.percent;
    document.getElementById('promoActive').checked = p.active;
  } else {
    document.getElementById('promoName').value = '';
    document.getElementById('promoCode').value = '';
    document.getElementById('promoPercent').value = 10;
    document.getElementById('promoActive').checked = true;
  }
  new bootstrap.Modal(document.getElementById('promoModal')).show();
}

function savePromoForm() {
  const id = document.getElementById('promoId').value;
  const data = {
    name: document.getElementById('promoName').value.trim(),
    code: document.getElementById('promoCode').value.trim(),
    percent: document.getElementById('promoPercent').value,
    active: document.getElementById('promoActive').checked
  };
  if (!data.name || !data.percent) { showToast('Preencha nome e porcentagem'); return; }
  if (id) {
    updatePromo(id, data);
    showToast('Promoção atualizada!');
  } else {
    addPromo(data);
    showToast('Promoção criada!');
  }
  bootstrap.Modal.getInstance(document.getElementById('promoModal')).hide();
  renderPromos();
}

document.addEventListener('DOMContentLoaded', renderPromos);
</script>
</body>
</html>
