<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – Nexora</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div class="container">
  <div class="row justify-content-center min-vh-100 align-items-center">
    <div class="col-md-5 col-lg-4">
      <div class="text-center mb-4">
        <h3 class="fw-bold text-white"><i class="bi bi-shield-lock me-2" style="color:var(--primary)"></i>Nexora Admin</h3>
        <p class="text-muted small">Acesso restrito a administradores</p>
      </div>
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Usuário</label>
            <input type="text" class="form-control" id="adminUser" placeholder="Seu usuário" autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Senha</label>
            <input type="password" class="form-control" id="adminPass" placeholder="••••••••" autocomplete="current-password">
          </div>
          <button class="btn btn-primary w-100 rounded-pill btn-lg" onclick="doLogin()">Entrar no Painel</button>
          <div id="loginError" class="text-danger small text-center mt-3" style="display:none"></div>
        </div>
      </div>
      <p class="text-center mt-3"><a href="../index.html" class="small text-muted"><i class="bi bi-arrow-left"></i> Voltar à loja</a></p>
    </div>
  </div>
</div>
<script src="../js/app.js"></script>
<script>
function doLogin(){
  const u = document.getElementById('adminUser').value.trim();
  const p = document.getElementById('adminPass').value;
  const err = document.getElementById('loginError');
  const user = findUser(u);
  if (user && user.role === 'admin' && user.password === p) {
    sessionStorage.setItem('nx_admin', '1');
    sessionStorage.setItem('nx_admin_user', user.name || user.username);
    sessionStorage.setItem('nx_admin_id', String(user.id));
    location.href = 'dashboard.html';
  } else {
    err.style.display = 'block';
    err.textContent = 'Usuário ou senha incorretos, ou sem permissão de admin.';
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
